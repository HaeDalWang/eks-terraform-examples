# ref: https://grafana.com/docs/loki/latest/setup/install/helm/install-scalable/
# SimpleScalable(SSD) 모드: read/write/backend 3-target 분리. HA 가능, distributed보다 운영 단순.

deploymentMode: SimpleScalable

serviceAccount:
  create: true
  name: loki
  annotations:
    eks.amazonaws.com/role-arn: ${sa_arn}

loki:
  commonConfig:
    replication_factor: 2
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
  ruler:
    enable_api: true
  # S3 경로: loki/ prefix, SSE-KMS
  storage:
    type: s3
    use_thanos_objstore: true
    bucketNames:
      chunks: ${s3_bucket}
      ruler: ${s3_bucket}
      admin: ${s3_bucket}
    object_store:
      storage_prefix: loki
      s3:
        bucket_name: ${s3_bucket}
        region: ${aws_region}
        sse:
          type: SSE-KMS
          kms_key_id: ${kms_key_arn}

chunksCache:
  enabled: true
  replicas: 1
resultsCache:
  enabled: true
  replicas: 1
minio:
  enabled: false

write:
  replicas: 2
  persistence:
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

read:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

backend:
  replicas: 2
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# 다른 배포 모드 비활성화
singleBinary:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0

gateway:
  enabled: true
  replicas: 1

canary:
  enabled: false
