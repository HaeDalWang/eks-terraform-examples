# ref: https://github.com/prometheus-community/helm-charts/tree/main/charts/prometheus
#
# 이 예제의 메트릭 척추:
#   Alloy(clustered) --remote_write--> Prometheus(이 차트, RW receiver) --sidecar(선택)--> S3
#
# Prometheus는 아무것도 직접 스크레이핑하지 않습니다 (serverFiles.scrape_configs 비움).
# 모든 스크레이핑은 Alloy(alloy-metrics)가 수행하고 remote_write로 밀어넣습니다.
# Thanos 관련 오버라이드는 enable_thanos=true일 때만 prometheus-thanos.yaml로 추가 병합됩니다.

server:
  extraFlags:
    - web.enable-lifecycle
    - web.enable-remote-write-receiver

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  persistentVolume:
    enabled: true
    size: 20Gi

  ingress:
    enabled: false # Envoy Gateway HTTPRoute로 노출

# 차트 내장 scrape job(kubernetes-nodes 등)을 전부 비움 (스크레이핑은 Alloy가 전담).
# Helm은 맵 값을 키 단위로 deep-merge하므로 scrapeConfigs: {} 로는 기본 job이 지워지지
# 않고, 각 job을 개별적으로 enabled: false 처리해야 한다.
# (serverFiles.prometheus.yml에 scrape_configs를 직접 넣는 방식도 차트 템플릿이
#  이를 다시 통째로 toYaml 덤프하면서 scrape_configs 키가 중복 정의되어 파싱 에러가 남)
scrapeConfigs:
  prometheus:
    enabled: false
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    enabled: false
  kubernetes-nodes-cadvisor:
    enabled: false
  kubernetes-service-endpoints:
    enabled: false
  kubernetes-service-endpoints-slow:
    enabled: false
  kubernetes-services:
    enabled: false
  kubernetes-pods:
    enabled: false
  kubernetes-pods-slow:
    enabled: false
  prometheus-pushgateway:
    enabled: false

alertmanager:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false
